version: 2
updates:
  - package-ecosystem: "nuget"
    directory: "/app-backend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "npm"
    directory: "/app-frontend"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    groups:
      vue:
        patterns:
          - "vue"
          - "@vue/*"
          - "vue-router"
          - "vue-tsc"
        update-types:
          - "major"
      vite:
        patterns:
          - "vite"
          - "@vitejs/*"
          - "vitest"
          - "@vitest/*"
        update-types:
          - "major"
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"
